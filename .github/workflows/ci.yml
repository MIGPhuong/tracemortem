name: TraceMortem CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Validate deployable files
        run: test -f dist/index.html && test -f dist/src/app.js && test -f dist/src/engine.js
